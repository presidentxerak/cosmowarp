<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="prof-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#999999"/>
      <stop offset="100%" stop-color="#666666"/>
    </linearGradient>
    <linearGradient id="prof-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aaaaaa"/>
      <stop offset="100%" stop-color="#666666"/>
    </linearGradient>
    <radialGradient id="prof-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#888888" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient glow -->
  <circle cx="100" cy="100" r="96" fill="url(#prof-glow)"/>

  <!-- Outer hexagonal ring -->
  <polygon points="100,8 180,54 180,146 100,192 20,146 20,54"
    fill="none" stroke="url(#prof-ring)" stroke-width="2" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate"
      from="0 100 100" to="360 100 100" dur="30s" repeatCount="indefinite"/>
  </polygon>

  <!-- Inner orbit ring -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#888888" stroke-width="1" opacity="0.2" stroke-dasharray="8 4">
    <animateTransform attributeName="transform" type="rotate"
      from="360 100 100" to="0 100 100" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbiting particles -->
  <circle cx="100" cy="28" r="3" fill="#999999" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate"
      from="0 100 100" to="360 100 100" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="172" cy="100" r="2" fill="#777777" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate"
      from="0 100 100" to="-360 100 100" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Head -->
  <circle cx="100" cy="78" r="28" fill="url(#prof-body)" opacity="0.9"/>
  <circle cx="92" cy="72" r="12" fill="white" opacity="0.08"/>

  <!-- Eyes -->
  <circle cx="88" cy="76" r="4" fill="white" opacity="0.9"/>
  <circle cx="112" cy="76" r="4" fill="white" opacity="0.9"/>
  <circle cx="89.5" cy="75" r="2" fill="#0a0a1a"/>
  <circle cx="113.5" cy="75" r="2" fill="#0a0a1a"/>
  <circle cx="90.5" cy="74" r="0.8" fill="white" opacity="0.8"/>
  <circle cx="114.5" cy="74" r="0.8" fill="white" opacity="0.8"/>

  <!-- Smile -->
  <path d="M 86 90 Q 100 102 114 90" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Body -->
  <path d="M 56 155 Q 56 120 78 114 Q 100 108 122 114 Q 144 120 144 155"
    fill="url(#prof-body)" opacity="0.7"/>

  <!-- Status indicator -->
  <circle cx="130" cy="92" r="7" fill="#0a0a1a" opacity="0.8"/>
  <circle cx="130" cy="92" r="5" fill="#aaaaaa" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Corner frame -->
  <line x1="20" y1="20" x2="40" y2="20" stroke="#777777" stroke-width="1" opacity="0.3"/>
  <line x1="20" y1="20" x2="20" y2="40" stroke="#777777" stroke-width="1" opacity="0.3"/>
  <line x1="180" y1="180" x2="160" y2="180" stroke="#777777" stroke-width="1" opacity="0.3"/>
  <line x1="180" y1="180" x2="180" y2="160" stroke="#777777" stroke-width="1" opacity="0.3"/>
</svg>
