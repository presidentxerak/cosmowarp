<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="hex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="hex-grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Outer hexagon -->
  <polygon points="100,12 174,55 174,145 100,188 26,145 26,55"
    fill="none" stroke="url(#hex-grad)" stroke-width="3" opacity="0.9"/>

  <!-- Second hexagon -->
  <polygon points="100,32 156,64 156,136 100,168 44,136 44,64"
    fill="none" stroke="url(#hex-grad)" stroke-width="2.2" opacity="0.7"/>

  <!-- Third hexagon -->
  <polygon points="100,52 138,73 138,127 100,148 62,127 62,73"
    fill="none" stroke="url(#hex-grad2)" stroke-width="1.8" opacity="0.6"/>

  <!-- Fourth hexagon -->
  <polygon points="100,68 122,81 122,119 100,132 78,119 78,81"
    fill="none" stroke="url(#hex-grad2)" stroke-width="1.4" opacity="0.5"/>

  <!-- Inner hexagon (core) -->
  <polygon points="100,82 110,88 110,112 100,118 90,112 90,88"
    fill="none" stroke="url(#hex-grad)" stroke-width="1.2" opacity="0.8"/>

  <!-- Radial lines from outer vertices to center -->
  <!-- Top vertex -->
  <line x1="100" y1="12" x2="100" y2="82" stroke="url(#hex-grad)" stroke-width="1.5" opacity="0.5"/>
  <!-- Top-right -->
  <line x1="174" y1="55" x2="110" y2="88" stroke="url(#hex-grad)" stroke-width="1.5" opacity="0.5"/>
  <!-- Bottom-right -->
  <line x1="174" y1="145" x2="110" y2="112" stroke="url(#hex-grad2)" stroke-width="1.5" opacity="0.5"/>
  <!-- Bottom -->
  <line x1="100" y1="188" x2="100" y2="118" stroke="url(#hex-grad2)" stroke-width="1.5" opacity="0.5"/>
  <!-- Bottom-left -->
  <line x1="26" y1="145" x2="90" y2="112" stroke="url(#hex-grad2)" stroke-width="1.5" opacity="0.5"/>
  <!-- Top-left -->
  <line x1="26" y1="55" x2="90" y2="88" stroke="url(#hex-grad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Cross-connecting lines between hex rings (mesh web) -->
  <!-- Top side connections -->
  <line x1="137" y1="33.5" x2="156" y2="64" stroke="url(#hex-grad)" stroke-width="1" opacity="0.35"/>
  <line x1="63" y1="33.5" x2="44" y2="64" stroke="url(#hex-grad)" stroke-width="1" opacity="0.35"/>
  <line x1="137" y1="33.5" x2="128" y2="60" stroke="url(#hex-grad2)" stroke-width="0.8" opacity="0.3"/>
  <line x1="63" y1="33.5" x2="72" y2="60" stroke="url(#hex-grad2)" stroke-width="0.8" opacity="0.3"/>

  <!-- Right side connections -->
  <line x1="174" y1="100" x2="156" y2="100" stroke="url(#hex-grad)" stroke-width="1" opacity="0.35"/>
  <line x1="156" y1="100" x2="138" y2="100" stroke="url(#hex-grad2)" stroke-width="0.8" opacity="0.3"/>
  <line x1="138" y1="100" x2="122" y2="100" stroke="url(#hex-grad)" stroke-width="0.7" opacity="0.25"/>

  <!-- Left side connections -->
  <line x1="26" y1="100" x2="44" y2="100" stroke="url(#hex-grad2)" stroke-width="1" opacity="0.35"/>
  <line x1="44" y1="100" x2="62" y2="100" stroke="url(#hex-grad)" stroke-width="0.8" opacity="0.3"/>
  <line x1="62" y1="100" x2="78" y2="100" stroke="url(#hex-grad2)" stroke-width="0.7" opacity="0.25"/>

  <!-- Bottom side connections -->
  <line x1="137" y1="166.5" x2="156" y2="136" stroke="url(#hex-grad2)" stroke-width="1" opacity="0.35"/>
  <line x1="63" y1="166.5" x2="44" y2="136" stroke="url(#hex-grad2)" stroke-width="1" opacity="0.35"/>
  <line x1="137" y1="166.5" x2="128" y2="140" stroke="url(#hex-grad)" stroke-width="0.8" opacity="0.3"/>
  <line x1="63" y1="166.5" x2="72" y2="140" stroke="url(#hex-grad)" stroke-width="0.8" opacity="0.3"/>

  <!-- Diagonal cross-mesh lines -->
  <line x1="156" y1="64" x2="138" y2="73" stroke="url(#hex-grad)" stroke-width="0.8" opacity="0.25"/>
  <line x1="156" y1="136" x2="138" y2="127" stroke="url(#hex-grad2)" stroke-width="0.8" opacity="0.25"/>
  <line x1="44" y1="64" x2="62" y2="73" stroke="url(#hex-grad2)" stroke-width="0.8" opacity="0.25"/>
  <line x1="44" y1="136" x2="62" y2="127" stroke="url(#hex-grad)" stroke-width="0.8" opacity="0.25"/>

  <!-- Inner mesh connections -->
  <line x1="138" y1="73" x2="122" y2="81" stroke="url(#hex-grad)" stroke-width="0.6" opacity="0.2"/>
  <line x1="138" y1="127" x2="122" y2="119" stroke="url(#hex-grad2)" stroke-width="0.6" opacity="0.2"/>
  <line x1="62" y1="73" x2="78" y2="81" stroke="url(#hex-grad2)" stroke-width="0.6" opacity="0.2"/>
  <line x1="62" y1="127" x2="78" y2="119" stroke="url(#hex-grad)" stroke-width="0.6" opacity="0.2"/>

  <!-- Vertex nodes (outer) -->
  <circle cx="100" cy="12" r="3" fill="#a855f7" opacity="0.8"/>
  <circle cx="174" cy="55" r="3" fill="#a855f7" opacity="0.8"/>
  <circle cx="174" cy="145" r="3" fill="#06b6d4" opacity="0.8"/>
  <circle cx="100" cy="188" r="3" fill="#06b6d4" opacity="0.8"/>
  <circle cx="26" cy="145" r="3" fill="#06b6d4" opacity="0.8"/>
  <circle cx="26" cy="55" r="3" fill="#a855f7" opacity="0.8"/>

  <!-- Vertex nodes (second ring) -->
  <circle cx="100" cy="32" r="2" fill="#c084fc" opacity="0.6"/>
  <circle cx="156" cy="64" r="2" fill="#c084fc" opacity="0.6"/>
  <circle cx="156" cy="136" r="2" fill="#22d3ee" opacity="0.6"/>
  <circle cx="100" cy="168" r="2" fill="#22d3ee" opacity="0.6"/>
  <circle cx="44" cy="136" r="2" fill="#22d3ee" opacity="0.6"/>
  <circle cx="44" cy="64" r="2" fill="#c084fc" opacity="0.6"/>

  <!-- Vertex nodes (third ring) -->
  <circle cx="100" cy="52" r="1.5" fill="#c084fc" opacity="0.5"/>
  <circle cx="138" cy="73" r="1.5" fill="#c084fc" opacity="0.5"/>
  <circle cx="138" cy="127" r="1.5" fill="#22d3ee" opacity="0.5"/>
  <circle cx="100" cy="148" r="1.5" fill="#22d3ee" opacity="0.5"/>
  <circle cx="62" cy="127" r="1.5" fill="#22d3ee" opacity="0.5"/>
  <circle cx="62" cy="73" r="1.5" fill="#c084fc" opacity="0.5"/>

  <!-- Center core -->
  <circle cx="100" cy="100" r="6" fill="url(#hex-grad)" opacity="0.9"/>
  <circle cx="100" cy="100" r="3" fill="white" opacity="0.95"/>
</svg>
